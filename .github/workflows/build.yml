name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          cp -r lib /tmp/lib && cp pubspec.yaml /tmp/pubspec.yaml && cp -r android_extra /tmp/android_extra
          flutter create --platforms=android --project-name cambridge_offline --org com.meda .
          cp -r /tmp/lib/. lib/ && cp /tmp/pubspec.yaml pubspec.yaml
          D=$(dirname "$(find android/app/src/main -name MainActivity.kt | head -1)")
          cp /tmp/android_extra/*.kt "$D/"
          M=android/app/src/main/AndroidManifest.xml
          P=""
          for x in INTERNET REQUEST_INSTALL_PACKAGES FOREGROUND_SERVICE FOREGROUND_SERVICE_DATA_SYNC POST_NOTIFICATIONS WAKE_LOCK REQUEST_IGNORE_BATTERY_OPTIMIZATIONS; do
            P="$P<uses-permission android:name=\"android.permission.$x\"/>\n    "
          done
          sed -i "s#<application#${P}<application#" $M
          sed -i 's#</application>#<service android:name=".DownloadService" android:foregroundServiceType="dataSync" android:exported="false"/>\n    </application>#' $M
          sed -i 's#android:label="[^"]*"#android:label="Cambridge Offline"#' $M
          cat $M
      - name: Restore signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
